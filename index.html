<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Radares CG</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Radares CG</h1>
      <p>Mapa colaborativo de fiscalização eletrônica — Campo Grande/MS</p>
    </div>
    <button id="btnLocate" class="btn">📍 Minha localização</button>
  </header>
  <section class="toolbar">
    <input id="search" type="search" placeholder="Pesquisar rua, avenida ou código..." />
    <select id="speedFilter">
      <option value="all">Todas as velocidades</option>
      <option value="30">30 km/h</option>
      <option value="50">50 km/h</option>
    </select>
    <select id="typeFilter">
      <option value="all">Todos os tipos</option>
      <option value="Lombada eletrônica">Lombada eletrônica</option>
      <option value="Radar fixo e discreto">Radar fixo e discreto</option>
      <option value="Misto híbrido">Misto híbrido</option>
      <option value="Misto com conversão">Misto com conversão</option>
    </select>
    <button id="btnGeocode" class="btn btn-primary">Preparar pontos do mapa</button>
    <button id="btnExport" class="btn" title="Baixa a base com as coordenadas encontradas">Exportar JSON geocodificado</button>
  </section>
  <section class="statusbar">
    <span id="count">Carregando...</span>
    <span id="geoStatus"></span>
  </section>
  <main>
    <div id="map"></div>
    <aside id="list"></aside>
  </main>
  <footer>
    <strong>Atenção:</strong> confira sempre a sinalização da via. O mapa é informativo e pode conter mudanças, imprecisões ou equipamentos ainda em implantação.
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data/part1.js"></script>
  <script src="data/part2.js"></script>
  <script src="js/app2.js"></script>
</body>
</html>
